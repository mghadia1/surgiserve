name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: surgiserve
          POSTGRES_PASSWORD: surgiserve
          POSTGRES_DB: surgiserve
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U surgiserve -d surgiserve"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 30
      redis:
        image: redis:8-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 30
    env:
      # The tests create this database and migrate it themselves. Without these
      # variables the service tests would fail here (in CI) rather than skip.
      SURGISERVE_TEST_DATABASE_URL: postgresql+psycopg://surgiserve:surgiserve@localhost:5432/surgiserve_test
      SURGISERVE_TEST_REDIS_URL: redis://localhost:6379/15
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - run: python -m pip install -e '.[dev]'

      - name: ruff
        run: |
          ruff check .
          ruff format --check .

      - name: mypy
        run: mypy

      - name: pytest
        run: python -m pytest -q

  compose:
    # The tests exercise the app in-process; this exercises the images the
    # way a user runs them: built by Compose, migrated by the one-shot
    # migrate service, reached over the network, with a real worker
    # processing the job.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: compose up
        run: docker compose up --build --detach --wait

      - name: smoke test over HTTP
        run: ./scripts/smoke.sh

      - name: logs on failure
        if: failure()
        run: docker compose logs

      - name: compose down
        if: always()
        run: docker compose down --volumes
