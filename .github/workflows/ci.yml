name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: surgiserve
          POSTGRES_PASSWORD: surgiserve
          POSTGRES_DB: surgiserve
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U surgiserve -d surgiserve"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 30
      redis:
        image: redis:8-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 30
    env:
      # The tests create this database and migrate it themselves. Without these
      # variables the service tests would fail here (in CI) rather than skip.
      SURGISERVE_TEST_DATABASE_URL: postgresql+psycopg://surgiserve:surgiserve@localhost:5432/surgiserve_test
      SURGISERVE_TEST_REDIS_URL: redis://localhost:6379/15
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      # CPU-only PyTorch first; from PyPI, x86 Linux would get the CUDA build.
      - run: python -m pip install --index-url https://download.pytorch.org/whl/cpu torch==2.13.0
      - run: python -m pip install -e '.[dev]'

      - name: ruff
        run: |
          ruff check .
          ruff format --check .

      - name: mypy
        run: mypy

      - name: pytest
        run: python -m pytest -q

  compose:
    # The tests exercise the app in-process; this exercises the images the
    # way a user runs them: built by Compose, migrated by the one-shot
    # migrate service, reached over the network, with a real worker
    # processing the job.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      # The real checkpoint is not in the repository. A random one with the
      # same architecture, made inside the built image, lets the worker run
      # the real inference code; the hashes are passed to it through the
      # environment. Its masks are meaningless; the pipeline is what's tested.
      - name: random weights
        run: |
          docker compose build
          mkdir -p weights && chmod 777 weights
          hashes="$(docker compose run --rm --no-deps -v "$PWD/weights:/out" \
            worker python -m surgiserve.random_checkpoint /out)"
          echo "$hashes"
          echo "SURGISERVE_MODEL_CHECKPOINT_SHA256=$(jq -r .checkpoint_sha256 <<<"$hashes")" >> "$GITHUB_ENV"
          echo "SURGISERVE_MODEL_CONFIG_SHA256=$(jq -r .config_sha256 <<<"$hashes")" >> "$GITHUB_ENV"

      - name: compose up
        run: docker compose up --detach --wait

      - name: smoke test over HTTP
        run: ./scripts/smoke.sh

      - name: logs on failure
        if: failure()
        run: docker compose logs

      - name: compose down
        if: always()
        run: docker compose down --volumes
