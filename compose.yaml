# Postgres, Redis, a one-shot migration step, the API and a worker.

# Development-only credentials. Nothing here is meant for a shared deployment.
x-database-url: &database-url postgresql+psycopg://surgiserve:surgiserve@db:5432/surgiserve
x-redis-url: &redis-url redis://redis:6379/0

services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: surgiserve
      POSTGRES_PASSWORD: surgiserve
      POSTGRES_DB: surgiserve
    # Published on 5433, and only on localhost, so it neither clashes with a
    # Postgres already on 5432 nor listens on the network.
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "surgiserve", "-d", "surgiserve"]
      interval: 2s
      timeout: 3s
      retries: 30

  redis:
    image: redis:8-alpine
    # Append-only file: queued job ids survive a Redis restart.
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "127.0.0.1:6380:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 3s
      retries: 30

  # Runs `alembic upgrade head` once and exits. The API and worker start only
  # after it has exited successfully, so neither sees an unmigrated schema.
  migrate:
    build:
      context: .
      target: api
    command: ["alembic", "upgrade", "head"]
    environment:
      SURGISERVE_DATABASE_URL: *database-url
    depends_on:
      db:
        condition: service_healthy

  api:
    build:
      context: .
      target: api
    ports:
      - "8000:8000"
    environment:
      SURGISERVE_DATABASE_URL: *database-url
      SURGISERVE_REDIS_URL: *redis-url
      SURGISERVE_STORAGE_DIR: /data/storage
    volumes:
      - storage:/data/storage
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    restart: unless-stopped

  worker:
    build:
      context: .
      target: worker
    environment:
      SURGISERVE_DATABASE_URL: *database-url
      SURGISERVE_REDIS_URL: *redis-url
      SURGISERVE_STORAGE_DIR: /data/storage
      # The real network by default; SURGISERVE_MODEL=fake runs without weights.
      SURGISERVE_MODEL: ${SURGISERVE_MODEL:-surgiseg}
      SURGISERVE_MODEL_CHECKPOINT_PATH: /weights/best-model.pt
      SURGISERVE_MODEL_CONFIG_PATH: /weights/config.json
      # Passed through only if set in the shell. Unset, the worker expects the
      # frozen run's hashes; CI sets them for its random test weights.
      SURGISERVE_MODEL_CHECKPOINT_SHA256:
      SURGISERVE_MODEL_CONFIG_SHA256:
      # Knobs for failure testing, also passed through only if set.
      SURGISERVE_FAKE_MODEL_DELAY_SECONDS:
      SURGISERVE_JOB_TIMEOUT_SECONDS:
      SURGISERVE_MAX_ATTEMPTS:
      # PyTorch threads per worker; 0 means PyTorch's default of one per CPU.
      # Default 1: on the benchmark machine, 4 workers x 1 thread ran 2.8x the
      # jobs/s of 4 workers at the default (README, "Load testing"). Scale
      # with more workers rather than more threads.
      SURGISERVE_TORCH_THREADS: ${SURGISERVE_TORCH_THREADS:-1}
    volumes:
      # Same volume as the API: the worker reads uploads and writes masks there.
      - storage:/data/storage
      # Weights stay outside the image and the repository (`make weights`).
      - ./weights:/weights:ro
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    restart: unless-stopped

volumes:
  pgdata:
  redisdata:
  storage:
