[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "surgiserve"
version = "0.1.0"
description = "Educational inference service for the surgiseg-ml instrument-segmentation model"
requires-python = ">=3.12"
license = "MIT"
dependencies = [
  "alembic>=1.20",
  "fastapi>=0.142",
  "pillow>=12.3",
  "psycopg[binary]>=3.3",
  "pydantic-settings>=2.15",
  "python-multipart>=0.0.32",
  "redis>=8.1",
  "sqlalchemy>=2.1",
  "uvicorn>=0.54",
]

[project.optional-dependencies]
# What the worker needs to run the real network. The API never imports it, so
# its image leaves this out (see the Dockerfile's api and worker targets).
model = [
  "numpy>=2.5",
  # The network and its config class come from surgiseg-ml itself, pinned to
  # the commit that matches the frozen run, rather than copied here.
  "surgiseg-ml @ https://github.com/mghadia1/surgiseg-ml/archive/cf7a02eef6148676b98d1c687c824060104311fa.zip",
  # The version the frozen benchmark was produced with. Install the CPU build
  # first (see the Dockerfile and CI); plain pip on x86 pulls the CUDA one.
  "torch==2.13.0",
]
# Load testing (bench/); not needed to run or test the service.
bench = ["locust>=2.46"]
dev = [
  "httpx2>=2.13",
  "mypy>=2.3",
  "pytest>=9.1",
  "ruff>=0.16",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
# Test the working tree, not whatever copy happens to be installed in the venv.
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 88
target-version = "py312"

[tool.ruff.lint]
# E/F: pycodestyle and pyflakes. I: import order. B: likely bugs.
# UP: modern syntax for the target version.
select = ["E", "F", "I", "B", "UP"]

[tool.mypy]
strict = true
files = ["src", "tests", "migrations", "bench"]

# surgiseg-ml ships no type information.
[[tool.mypy.overrides]]
module = ["surgiseg", "surgiseg.*"]
ignore_missing_imports = true
